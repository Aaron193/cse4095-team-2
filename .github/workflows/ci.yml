# Runs on every pull request and on pushes to main (task P0-D2).
# A pull request may merge only when "Lint, typecheck, test" is green (task P0-D3 makes it a
# required check, by that exact name). The Postgres job (task P1-D7) runs the server tests
# again on the database production uses.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  postgres:
    name: Server tests on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # The major version render.yaml asks Render for.
        image: postgres:16
        env:
          POSTGRES_USER: delve
          POSTGRES_PASSWORD: delve
          POSTGRES_DB: delve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delve -d delve_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # With DATABASE_URL set, test/helpers.ts uses Postgres instead of in-memory SQLite and
      # vitest.config.ts runs the test files one at a time.
      DATABASE_URL: postgres://delve:delve@localhost:5432/delve_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Test the server on Postgres
        run: npm test -w apps/server
